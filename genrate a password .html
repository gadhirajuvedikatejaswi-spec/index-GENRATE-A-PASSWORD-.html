
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Random Password Generator</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .container {
            width: 400px;
            background: bisque;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 25px;
        }

        .password-box {
            display: flex;
            margin-bottom: 20px;
        }

        #password {
            width: 100%;
            padding: 13px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 8px 0 0 8px;
            outline: none;
        }

        #copyBtn {
            padding: 0 15px;
            border: none;
            background: #667eea;
            color: white;
            cursor: pointer;
            border-radius: 0 8px 8px 0;
        }

        .option {
            margin: 15px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .option label {
            color: #333;
        }

        #length {
            width: 70px;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        #generateBtn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #667eea;
            color: white;
            font-size: 16px;
            cursor: pointer;
            margin-top: 15px;
        }

        #generateBtn:hover,
        #copyBtn:hover {
            background: #5568d9;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            color: green;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🔐 Password Generator</h1>

        <div class="password-box">
            <input type="text" id="password" readonly placeholder="Your password">
            <button id="copyBtn">Copy</button>
        </div>

        <div class="option">
            <label>Password Length</label>
            <input type="number" id="length" value="12" min="4" max="50">
        </div>

        <div class="option">
            <label>Uppercase (A-Z)</label>
            <input type="checkbox" id="uppercase" checked>
        </div>

        <div class="option">
            <label>Lowercase (a-z)</label>
            <input type="checkbox" id="lowercase" checked>
        </div>

        <div class="option">
            <label>Numbers (0-9)</label>
            <input type="checkbox" id="numbers" checked>
        </div>

        <div class="option">
            <label>Special Characters</label>
            <input type="checkbox" id="symbols" checked>
        </div>

        <button id="generateBtn">Generate Password</button>

        <p id="message"></p>

    </div>


    <script>

        const password = document.getElementById("password");
        const length = document.getElementById("length");

        const uppercase = document.getElementById("uppercase");
        const lowercase = document.getElementById("lowercase");
        const numbers = document.getElementById("numbers");
        const symbols = document.getElementById("symbols");

        const generateBtn = document.getElementById("generateBtn");
        const copyBtn = document.getElementById("copyBtn");
        const message = document.getElementById("message");


        function generatePassword() {

            const upperChars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
            const lowerChars = "abcdefghijklmnopqrstuvwxyz";
            const numberChars = "0123456789";
            const symbolChars = "!@#$%^&*()_+-=[]{}|;:,.<>?";

            let characters = "";

            if (uppercase.checked) {
                characters += upperChars;
            }

            if (lowercase.checked) {
                characters += lowerChars;
            }

            if (numbers.checked) {
                characters += numberChars;
            }

            if (symbols.checked) {
                characters += symbolChars;
            }


            if (characters === "") {
                alert("Please select at least one option!");
                return;
            }


            let result = "";

            for (let i = 0; i < length.value; i++) {

                const randomIndex =
                    Math.floor(Math.random() * characters.length);

                result += characters[randomIndex];
            }

            password.value = result;

            message.textContent = "";
        }


        generateBtn.addEventListener("click", generatePassword);


        copyBtn.addEventListener("click", function() {

            if (password.value === "") {
                alert("Generate a password first!");
                return;
            }

            navigator.clipboard.writeText(password.value);

            message.textContent = "Password copied!";
        });

    </script>

</body>

</html>
